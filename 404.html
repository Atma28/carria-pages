<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; img-src 'none'; font-src 'none'; connect-src 'none'; script-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Page introuvable — Carria</title>
    <style>
      :root {
        --bleu: #2563eb;
        --ardoise: #0f172a;
        --ardoise-clair: #475569;
        --fond: #f8fafc;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        padding: 24px 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--fond);
        color: var(--ardoise);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        line-height: 1.6;
        -webkit-text-size-adjust: 100%;
      }

      main {
        max-width: 30rem;
        text-align: center;
      }

      .marque {
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        margin: 0 0 24px;
      }
      .marque .a {
        color: var(--ardoise);
      }
      .marque .b {
        color: var(--bleu);
      }

      h1 {
        font-size: 1.375rem;
        margin: 0 0 12px;
      }

      p {
        margin: 0;
        font-size: 1.0625rem;
        color: var(--ardoise-clair);
      }
      p[lang="en"] {
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="marque"><span class="a">Car</span><span class="b">ria</span></p>
      <h1>Page introuvable</h1>
      <!-- Aucun lien : voir index.html, un lien mort serait pire. -->
      <p lang="fr">Cette page n'existe pas ou a été déplacée.</p>
      <p lang="en">This page does not exist, or it has moved.</p>
    </main>
  </body>
</html>
